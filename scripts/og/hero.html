<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400;1,6..72,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  /* 1200x630 OG card in the site's midnight-editorial tokens */
  :root {
    --paper: #14161b;
    --card: #1c1f26;
    --ink: #e9e6df;
    --bright: #f6f3ea;
    --muted: #9a968c;
    --hair: #2b2f38;
    --border: #3a3f4a;
    --shadow: #0b0c0f;
    --amber: #e0a458;
    --blue: #7fa8c9;
    --serif: Newsreader, Georgia, serif;
    --sans: Inter, -apple-system, 'Segoe UI', sans-serif;
  }
  * { box-sizing: border-box; margin: 0; }
  body {
    width: 1200px;
    height: 630px;
    background: var(--paper);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: var(--sans);
  }
  .card {
    width: 1040px;
    height: 470px;
    background: var(--card);
    border: 3px solid var(--border);
    border-radius: 18px;
    box-shadow: 12px 12px 0 var(--shadow);
    padding: 64px 76px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }
  .domain {
    font-size: 22px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--muted);
    font-weight: 500;
  }
  .name {
    font-family: var(--serif);
    font-weight: 500;
    font-size: 96px;
    line-height: 1.08;
    color: var(--bright);
  }
  .journey {
    font-size: 30px;
    color: var(--muted);
    line-height: 1.4;
  }
  .journey .arrow { color: var(--blue); }
  .journey .now { color: var(--amber); font-weight: 500; }
  .rule {
    height: 1px;
    background: var(--hair);
    margin: 26px 0;
  }
  .tagline {
    font-family: var(--serif);
    font-style: italic;
    font-size: 27px;
    color: var(--ink);
  }
</style>
</head>
<body>
  <div class="card">
    <div class="domain">ardabasarici.dev</div>
    <div>
      <div class="name">Arda Başarıcı</div>
    </div>
    <div>
      <div class="journey">Mathematics <span class="arrow">→</span> game development <span class="arrow">→</span> <span class="now">Data, ML &amp; AI</span></div>
      <div class="rule"></div>
      <div class="tagline">A bias for honest evaluation over shiny demos.</div>
    </div>
  </div>
</body>
</html>
